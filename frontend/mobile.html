<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LookAlike – Take a Selfie</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px 16px;
            max-width: 480px;
            margin: 0 auto;
            background: #0c0c12;
            color: #eeeef5;
        }
        h2 { text-align: center; margin-bottom: 6px; }
        p  { text-align: center; color: #8585ad; font-size: 0.95rem; }

        #capture-btn {
            display: block;
            width: 100%;
            margin: 20px 0;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6aff, #9333ea);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        #capture-btn:disabled { opacity: 0.55; cursor: default; }

        #preview {
            display: none;
            width: 100%;
            border-radius: 12px;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #status {
            text-align: center;
            margin-top: 16px;
            font-size: 1rem;
            min-height: 1.4em;
        }
        #status.success { color: #34d399; font-weight: 600; }
        #status.error   { color: #f87171; }
    </style>
</head>
<body>
    <h2>&#x2728; LookAlike Party</h2>
    <p>Take a selfie to find your celebrity lookalike.<br>Watch the live biometric scan on the main screen!</p>

    <input type="file" id="file-input" accept="image/*" capture="user" style="display:none">
    <button id="capture-btn">&#x1F4F7; Take Selfie</button>

    <img id="preview" alt="Your selfie preview">
    <div id="status"></div>

    <script>
        const sessionId = window.location.pathname.split('/').pop();

        const captureBtn = document.getElementById('capture-btn');
        const fileInput  = document.getElementById('file-input');
        const preview    = document.getElementById('preview');
        const statusEl   = document.getElementById('status');

        function compressImageFile(file, maxSide = 960, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Could not read file'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => resolve(reader.result);
                    img.onload = () => {
                        let w = img.naturalWidth || img.width;
                        let h = img.naturalHeight || img.height;
                        if (w > maxSide || h > maxSide) {
                            const scale = maxSide / Math.max(w, h);
                            w = Math.max(1, Math.round(w * scale));
                            h = Math.max(1, Math.round(h * scale));
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        captureBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            fileInput.value = '';
            if (!file) return;

            statusEl.className = '';
            statusEl.textContent = 'Optimising & uploading selfie…';
            captureBtn.disabled = true;

            try {
                const dataUrl = await compressImageFile(file, 960, 0.85);
                preview.src = dataUrl;
                preview.style.display = 'block';

                const b64 = dataUrl.split(',')[1];
                const resp = await fetch(`/mobile/${sessionId}/upload`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image_base64: b64}),
                });
                if (resp.status === 422) {
                    throw new Error('No face detected. Please take a clearer front-facing selfie.');
                }
                if (!resp.ok) {
                    throw new Error(`Server error ${resp.status}`);
                }
                statusEl.className = 'success';
                statusEl.textContent = '✓ Selfie sent! Watch the main screen for your live scan.';
            } catch (e) {
                statusEl.className = 'error';
                statusEl.textContent = 'Upload failed: ' + e.message;
                captureBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
