<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LookAlike – Find Your Celebrity Twin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0c0c12;
      --surface:      #16161f;
      --surface-2:    #1e1e2a;
      --border:       rgba(255,255,255,0.08);
      --accent:       #7c6aff;
      --accent-light: #c084fc;
      --text:         #eeeef5;
      --muted:        #7878a0;
      --success:      #34d399;
      --warn:         #fbbf24;
      --error:        #f87171;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 5rem 1.5rem 3.5rem;
      max-width: 640px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(124,106,255,0.15);
      color: var(--accent-light);
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 1.1rem;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }

    /* ── Upload zone ──────────────────────────────────── */
    .upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      max-width: 340px;
      margin: 0 auto;
    }
    #upload { display: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-align: center;
    }
    .btn:hover  { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); opacity: 1; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .divider {
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Results area ─────────────────────────────────── */
    #results {
      max-width: 640px;
      margin: 2.5rem auto 5rem;
      padding: 0 1.5rem;
      min-height: 2rem;
    }

    .status-msg {
      text-align: center;
      color: var(--muted);
      padding: 1.5rem;
      font-size: 0.95rem;
    }
    .status-msg.error { color: var(--error); }

    /* Spinner */
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Carousel ─────────────────────────────────────── */
    .results-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .results-header p {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    .carousel { display: flex; align-items: center; justify-content: center; gap: 1rem; }

    .carousel-viewport {
      overflow: hidden;
      width: 220px;
      border-radius: 18px;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .carousel-item {
      flex: 0 0 220px;
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .carousel-item img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .carousel-item-info { padding: 0.9rem 1rem 1rem; }
    .celeb-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .match-pct {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .match-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .match-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s ease 0.15s;
    }

    .carousel-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .carousel-btn:hover { background: rgba(124,106,255,0.2); }

    .carousel-counter {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.85rem;
    }

    /* ── QR panel ─────────────────────────────────────── */
    .qr-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 300px;
      margin: 0 auto;
    }
    .qr-panel h3 { font-size: 1rem; margin-bottom: 0.4rem; }
    .qr-panel .sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
    .qr-panel canvas, .qr-panel img { border-radius: 8px; }
    .qr-url {
      font-size: 0.68rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 0.75rem;
    }
    .warn-banner {
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--warn);
      text-align: left;
      line-height: 1.5;
    }
    .waiting-text::after {
      content: '';
      animation: dots 1.4s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Look<span>Alike</span></div>
  </header>

  <section class="hero">
    <div class="hero-badge">&#x2728; AI-powered</div>
    <h1>Find your<br><em>celebrity twin</em></h1>
    <p>Upload a selfie and our AI matches your face against thousands of celebrities to find who you most resemble.</p>

    <div class="upload-zone">
      <input type="file" id="upload" accept="image/*" capture="user">
      <button class="btn btn-primary" onclick="document.getElementById('upload').click()">
        &#x1F4F7;&nbsp; Upload a photo
      </button>
      <div class="divider">or</div>
      <button class="btn btn-secondary" id="phone-btn">
        &#x1F4F1;&nbsp; Scan QR with your phone
      </button>
    </div>
  </section>

  <div id="results"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
